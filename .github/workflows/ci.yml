name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run pyright
      - name: Check architecture
        run: uv run lint-imports --no-cache
      - name: Audit dependencies
        run: uv run pip-audit

  test:
    name: Tests and package (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Run deterministic tests with coverage
        run: uv run pytest --cov=slop_measure --cov-report=term-missing
      - name: Verify retained dependency behavior
        run: uv run pytest tests/learning
      - name: Verify benchmark accounting
        run: uv run pytest tests/performance
      - name: Build distributions
        run: uv build
      - name: Prepare locked release constraints
        run: |
          uv run python -c "from pathlib import Path; Path('.tmp').mkdir(exist_ok=True)"
          uv export --locked --no-default-groups --no-emit-project --format requirements-txt --no-hashes --output-file .tmp/release-constraints.txt
      - name: Test isolated wheel and source installations
        env:
          SLOP_RELEASE_DIST: dist
          SLOP_RELEASE_CONSTRAINTS: .tmp/release-constraints.txt
        run: uv run pytest tests/integration/test_distribution.py
      - name: Smoke-test CLI
        run: uv run slop --help
